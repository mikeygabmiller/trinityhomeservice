<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Keep this page out of Google / search engines -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Site Stats — Trinity Exterior Cleaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2e3eb0;
    --blue-dark: #232f8a;
    --text-light: #6b7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(180deg, #ffffff 0%, #eef1f9 100%);
    color: #1a1a1a;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(46, 62, 176, 0.15);
    padding: 48px 44px 40px;
    text-align: center;
    max-width: 420px;
    width: 100%;
  }
  .brand {
    font-family: 'Permanent Marker', cursive;
    color: var(--blue);
    font-size: 26px;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .label {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 28px;
  }
  .count {
    font-weight: 700;
    font-size: clamp(56px, 16vw, 88px);
    line-height: 1;
    color: var(--blue);
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .count.loading { opacity: 0.4; }
  .count-sub {
    font-size: 14px;
    color: var(--text-light);
    margin-bottom: 32px;
  }
  .refresh {
    background: var(--blue);
    color: #fff;
    border: none;
    cursor: pointer;
    padding: 12px 28px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.04em;
    transition: background 0.2s, transform 0.15s;
  }
  .refresh:hover { background: var(--blue-dark); transform: translateY(-1px); }
  .refresh:active { transform: translateY(0); }
  .foot {
    margin-top: 26px;
    font-size: 11px;
    color: #9aa1ad;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Trinity Exterior Cleaning</div>
    <div class="label">Website Page Views</div>
    <div class="count loading" id="count">…</div>
    <div class="count-sub" id="sub">since launch</div>
    <button class="refresh" id="refresh">Refresh</button>
    <div class="foot">
      Private dashboard — not linked anywhere and hidden from search engines.<br>
      Counts total homepage views. No cookies or personal data collected.
    </div>
  </div>

<script>
  // Read-only: uses /get so opening this page never inflates the count.
  var NS = 'trinity-exterior-cleaning-9f4a2x';
  var KEY = 'home';
  var countEl = document.getElementById('count');
  var subEl = document.getElementById('sub');
  var btn = document.getElementById('refresh');

  function render(value) {
    countEl.classList.remove('loading');
    countEl.textContent = Number(value || 0).toLocaleString();
  }

  async function load() {
    countEl.classList.add('loading');
    countEl.textContent = '…';
    subEl.textContent = 'since launch';
    try {
      var res = await fetch('https://abacus.jasoncameron.dev/get/' + NS + '/' + KEY, { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status');
      var data = await res.json();
      render(data.value);
    } catch (e) {
      // No views recorded yet (counter not created) or network issue.
      render(0);
      subEl.textContent = 'no views recorded yet';
    }
  }

  btn.addEventListener('click', load);
  load();
</script>
</body>
</html>
